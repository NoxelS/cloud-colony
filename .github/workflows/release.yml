name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      agents: ${{ steps.agents.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source commit
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Discover agents
        id: agents
        run: |
          agents="$(node scripts/list-agents.mjs)"
          printf 'list=%s\n' "$agents" >> "$GITHUB_OUTPUT"
      - name: Wait for successful main CI and publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')"
            if [ "$count" -gt 0 ]; then exit 0; fi
            printf 'Waiting for main CI (%s/20).\n' "$attempt"
            sleep 15
          done
          echo '::error::No successful main CI run published this commit within five minutes.'
          exit 1

  release:
    name: Promote images and create GitHub release
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the existing commit digests
        env:
          AGENTS: ${{ needs.source.outputs.agents }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          images="$(jq -er '.[].image' <<< "$AGENTS")"
          while IFS= read -r image; do
            source="$image:sha-$RELEASE_SHA"
            target="$image:$RELEASE_TAG"
            digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if existing="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')"; then
              if [ "$existing" != "$digest" ]; then
                echo "::error::$target already points to a different image."
                exit 1
              fi
            else
              docker buildx imagetools create --tag "$target" "$image@$digest"
            fi
            promoted="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$promoted" = "$digest"
            printf 'Container: %s\nDigest: %s@%s\n\n' "$target" "$image" "$digest" >> "$RUNNER_TEMP/release-notes.md"
            echo "Released $image@$digest as $target."
          done <<< "$images"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub release already exists; promoted image digests were verified.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
