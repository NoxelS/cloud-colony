name: Release

on:
  workflow_call:
    inputs:
      agents:
        required: true
        type: string

jobs:
  release:
    name: Promote images and create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Determine the version for this commit
        id: version
        run: |
          version="$(node scripts/release-version.mjs)"
          printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the existing commit digests
        env:
          AGENTS: ${{ inputs.agents }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          images="$(jq -er '.[].image' <<< "$AGENTS")"
          while IFS= read -r image; do
            source="$image:sha-$GITHUB_SHA"
            target="$image:$RELEASE_TAG"
            digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            if existing="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')"; then
              if [ "$existing" != "$digest" ]; then
                echo "::error::$target already points to a different image."
                exit 1
              fi
            else
              docker buildx imagetools create --tag "$target" "$image@$digest"
            fi
            promoted="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')"
            test "$promoted" = "$digest"
            printf 'Container: %s\nDigest: %s@%s\n\n' "$target" "$image" "$digest" >> "$RUNNER_TEMP/release-notes.md"
            echo "Released $image@$digest as $target."
          done <<< "$images"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          ref="refs/tags/$RELEASE_TAG"
          if git show-ref --verify --quiet "$ref"; then
            test "$(git rev-parse "$ref^{commit}")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=$ref" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub release already exists; promoted image digests were verified.'
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
