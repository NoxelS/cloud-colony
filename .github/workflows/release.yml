name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/noxels/cloud-colony

jobs:
  release:
    name: Promote tested image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source commit
        id: source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0.'
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for successful main CI and publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          # Tags can be pushed before the corresponding main run finishes.
          for attempt in $(seq 1 20); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$RELEASE_SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")] | length')"
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            printf 'Waiting for main CI (%s/20).\n' "$attempt"
            sleep 15
          done
          echo '::error::No successful main CI run published this commit within five minutes. Wait for CI to pass, then rerun this release job.'
          exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the existing digest
        id: promote
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source="$IMAGE:sha-$RELEASE_SHA"
          target="$IMAGE:$RELEASE_TAG"
          digest="$(docker buildx imagetools inspect "$source" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if existing="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' 2>/dev/null | jq -er '.digest')"; then
            if [ "$existing" != "$digest" ]; then
              echo '::error::This release version already points to a different image. Create a new version instead of overwriting it.'
              exit 1
            fi
          fi
          docker buildx imagetools create --tag "$target" "$IMAGE@$digest"
          promoted="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')"
          test "$promoted" = "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Released %s@%s as %s.\n' "$IMAGE" "$digest" "$target" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub release already exists; image digest was verified.'
            exit 0
          fi
          printf 'Container: %s:%s\n\nDigest: %s@%s\n' "$IMAGE" "$RELEASE_TAG" "$IMAGE" "$IMAGE_DIGEST" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md"
