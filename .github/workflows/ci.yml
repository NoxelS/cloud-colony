name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'JS'
          if (!/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+$/u.test(process.env.PR_TITLE ?? "")) {
            console.error("Use a Conventional Commit title, for example: chore: bootstrap repository tooling");
            process.exitCode = 1;
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  infrastructure:
    name: Infrastructure checks
    outputs:
      agents: ${{ steps.agents.outputs.list }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node scripts/lint-infra.mjs
      - name: Discover agents
        id: agents
        run: |
          agents="$(node scripts/list-agents.mjs)"
          printf 'list=%s\n' "$agents" >> "$GITHUB_OUTPUT"

  containers:
    name: Check agent image
    if: github.event_name == 'pull_request'
    needs: [quality, infrastructure]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.infrastructure.outputs.agents) }}
    uses: ./.github/workflows/agent-image.yml
    with:
      agent: ${{ matrix.name }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      fixture: ${{ matrix.fixture }}

  publish:
    name: Publish agent image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, infrastructure]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.infrastructure.outputs.agents) }}
    uses: ./.github/workflows/agent-image.yml
    with:
      agent: ${{ matrix.name }}
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      fixture: ${{ matrix.fixture }}
      publish: true

  ci:
    name: ci
    if: always()
    needs: [quality, infrastructure, containers, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          INFRASTRUCTURE: ${{ needs.infrastructure.result }}
          IMAGES: ${{ needs.containers.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          test "$QUALITY/$INFRASTRUCTURE" = success/success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test "$IMAGES/$PUBLISH" = success/skipped
          else
            test "$IMAGES/$PUBLISH" = skipped/success
          fi
