name: Agent image

on:
  workflow_call:
    inputs:
      agent:
        required: true
        type: string
      image:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      fixture:
        required: true
        type: string
      publish:
        type: boolean
        default: false

jobs:
  image:
    name: ${{ inputs.agent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ${{ inputs.image }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      FIXTURE: ${{ inputs.fixture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.1
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.1
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
          cache: false
      - name: Build, smoke-test, and scan both platforms
        run: |
          for arch in amd64 arm64; do
            tag="$IMAGE:check-$arch"
            docker buildx build --load --provenance=false --sbom=false --platform "linux/$arch" \
              --build-arg "VCS_REF=$GITHUB_SHA" --file "$DOCKERFILE" --tag "$tag" .
            node scripts/container-check.mjs --skip-build --platform "linux/$arch" \
              --tag "$tag" --dockerfile "$DOCKERFILE" --fixture "$FIXTURE"
            trivy image --image-src docker --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 "$tag"
          done
      - name: Generate SBOMs from the tested images
        if: inputs.publish
        run: |
          for arch in amd64 arm64; do
            trivy image --image-src docker --format cyclonedx \
              --output "$RUNNER_TEMP/sbom-$arch.json" "$IMAGE:check-$arch"
          done
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact tested images
        if: inputs.publish
        id: push
        run: |
          for arch in amd64 arm64; do
            platform="$IMAGE:sha-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "$IMAGE:check-$arch" "$platform"
            docker push "$platform"
            digest="$(docker buildx imagetools inspect "$platform" --format '{{json .Manifest}}' | jq -er '.digest')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s=%s\n' "$arch" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Attest the AMD64 SBOM
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.amd64 }}
          sbom-path: ${{ runner.temp }}/sbom-amd64.json
          push-to-registry: true
      - name: Attest the ARM64 SBOM
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.push.outputs.arm64 }}
          sbom-path: ${{ runner.temp }}/sbom-arm64.json
          push-to-registry: true
      - name: Publish the multi-platform commit tag
        if: inputs.publish
        id: manifest
        env:
          AMD64: ${{ steps.push.outputs.amd64 }}
          ARM64: ${{ steps.push.outputs.arm64 }}
        run: |
          target="$IMAGE:sha-$GITHUB_SHA"
          if existing="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' 2>/dev/null)"; then
            jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' <<< "$existing"
            for arch in amd64 arm64; do
              platform_digest="$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.architecture == $arch) | .digest' <<< "$existing")"
              docker buildx imagetools inspect "$IMAGE@$platform_digest" --format '{{json .Image}}' \
                | jq -e --arg arch "$arch" --arg sha "$GITHUB_SHA" \
                  '.architecture == $arch and .os == "linux" and .config.Labels["org.opencontainers.image.revision"] == $sha and .config.Labels["org.opencontainers.image.source"] == "https://github.com/NoxelS/cloud-colony"'
            done
            echo 'Keeping the verified image already published for this commit.'
          else
            docker buildx imagetools create --tag "$target" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          fi
          digest="$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s as %s.\n' "$IMAGE" "$digest" "$target" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest the published manifest
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
